name: Release

# Tagging is the release: bump appversion.py, commit, `git tag v1.2.3`, push.
# Every other trigger builds the same .dmg and hands it back as an artifact
# without publishing anything, so the packaging is exercised long before a tag
# depends on it.
on:
  push:
    tags: ['v*']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python to bundle (needs a universal2 installer on python.org)'
        default: '3.13.7'
        required: false

permissions:
  contents: write          # only used by the publish step, on tags

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      # A step's `if:` may not read the `secrets` context — only a job's `env`
      # may — so "do we have credentials" is answered once here and the steps
      # test the answer. Both are the string "true" or "false".
      HAVE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAVE_NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # release notes link to the previous tag

      - name: Show the runner
        run: |
          sw_vers
          echo "arch: $(uname -m)"
          xcodebuild -version | head -1 || true

      # A tag that disagrees with the version the app reports about itself would
      # ship a binary calling itself something the release notes don't.
      - name: Check the tag matches appversion.py
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          src="$(python3 -c 'import appversion; print(appversion.__version__)')"
          echo "tag=$tag  appversion.__version__=$src"
          if [ "$tag" != "$src" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match appversion.__version__ ($src). Bump one of them."
            exit 1
          fi

      # The runner's own Python is single-architecture, and py2app copies the
      # interpreter it is run with straight into the bundle — so an Apple Silicon
      # runner would quietly produce a .dmg that no Intel Mac can open. The
      # python.org macos11 package is the universal2 framework build.
      - name: Install the universal2 Python from python.org
        env:
          WANTED: ${{ github.event.inputs.python_version || '3.13.7' }}
        run: |
          set -euo pipefail
          base="https://www.python.org/ftp/python"
          version="$WANTED"
          url="$base/$version/python-$version-macos11.pkg"
          if ! curl -fsI "$url" >/dev/null; then
            series="${version%.*}"
            echo "::warning::no installer for $version; taking the newest $series.x instead"
            version="$(curl -fsS "$base/" \
                       | grep -oE "\"${series//./\\.}\.[0-9]+/\"" | tr -d '"/' \
                       | sort -t. -k3 -n | tail -1)"
            url="$base/$version/python-$version-macos11.pkg"
            curl -fsI "$url" >/dev/null
          fi
          echo "Installing Python $version"
          curl -fsSL -o "$RUNNER_TEMP/python.pkg" "$url"
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /

          series="${version%.*}"
          framework="/Library/Frameworks/Python.framework/Versions/$series"
          "$framework/bin/python3" -VV
          echo "architectures: $(lipo -archs "$framework/Python")"
          echo "PYTHON=$framework/bin/python3" >> "$GITHUB_ENV"

      # Absent on pull requests from forks, and on any repository that hasn't
      # been given the secrets — build.sh then falls back to an ad-hoc signature
      # and names the .dmg "-unsigned", which the publish step refuses to release.
      - name: Import the Developer ID certificate
        if: env.HAVE_CERTIFICATE == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          WANTED_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          umask 077
          CERT_P12="$CERT_P12" python3 -c \
            'import base64, os, sys; sys.stdout.buffer.write(base64.b64decode(os.environ["CERT_P12"]))' \
            > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"       # no auto-lock mid-build
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
                          -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a GUI prompt that nobody can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
                   -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" \
                   $(security list-keychains -d user | tr -d '" ')
          rm -f "$RUNNER_TEMP/cert.p12"

          identity="$WANTED_IDENTITY"
          if [ -z "$identity" ]; then
            identity="$(security find-identity -v -p codesigning "$keychain" \
                        | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          fi
          if [ -z "$identity" ]; then
            echo "::error::the imported certificate holds no Developer ID Application identity"
            exit 1
          fi
          echo "Signing as: $identity"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Write the notarization key
        if: env.HAVE_NOTARY_KEY == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          python3 -c \
            'import base64, os, sys; sys.stdout.buffer.write(base64.b64decode(os.environ["NOTARY_KEY_P8"]))' \
            > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build the app and the disk image
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: packaging/build.sh

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          [ -d dist ] || exit 0
          {
            echo "### Costpoint Timesheet"
            echo
            for dmg in dist/*.dmg; do
              [ -e "$dmg" ] || continue
              echo "- \`$(basename "$dmg")\` — $(du -h "$dmg" | cut -f1)"
              echo "  \`$(shasum -a 256 "$dmg" | cut -d' ' -f1)\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: costpoint-timesheet-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      # A .dmg nobody can open isn't a release. The artifact above is still
      # there to download and test with.
      - name: A tagged release has to be signed and notarized
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          if ls dist/*-unsigned.dmg >/dev/null 2>&1; then
            echo "::error::built unsigned — add the signing secrets (see docs/RELEASING.md) and re-tag."
            exit 1
          fi
          dmg="$(ls dist/*.dmg)"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dmg="$(ls dist/*.dmg)"
          version="${GITHUB_REF_NAME#v}"
          previous="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"

          {
            echo "Download **$(basename "$dmg")**, open it, and drag Costpoint Timesheet"
            echo "into Applications. Open it once from there: it installs its own launch"
            echo "agents, and the ⚪️ dot in the menu bar is where setup starts."
            echo
            echo "Signed with a Developer ID and notarized by Apple, so it opens with a"
            echo "double-click — no right-click-Open, no quarantine to clear."
            echo
            echo "Requires macOS 11 Big Sur or later. Universal — Apple Silicon and Intel."
            echo
            echo '```'
            echo "sha256  $(shasum -a 256 "$dmg" | cut -d' ' -f1)"
            echo '```'
            if [ -n "$previous" ]; then
              echo
              echo "**Changes:** https://github.com/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
            fi
          } > "$RUNNER_TEMP/notes.md"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" "$dmg" \
               --title "Costpoint Timesheet $version" \
               --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Forget the signing key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
